<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="560" viewBox="0 0 1000 560" fill="none">
  <defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#07121f"/><stop offset="1" stop-color="#102e49"/></linearGradient><linearGradient id="accent" x2="1" y2="1"><stop stop-color="#58b7ff"/><stop offset="1" stop-color="#0f5fa8"/></linearGradient><pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" stroke="#5ab5ff" stroke-opacity=".07"/></pattern><filter id="glow"><feGaussianBlur stdDeviation="20"/></filter></defs>
  <style>.component{animation:assemble 5s ease-in-out infinite}.c2{animation-delay:.5s}.c3{animation-delay:1s}.cursor{animation:move 6s ease-in-out infinite}.click{transform-box:fill-box;transform-origin:center;animation:click 6s ease-out infinite}.phone{animation:float 5s ease-in-out infinite}.swatch{transform-box:fill-box;transform-origin:center;animation:pulse 3s ease-in-out infinite}.s2{animation-delay:.4s}.s3{animation-delay:.8s}@keyframes assemble{0%,10%{transform:translateY(18px);opacity:.2}40%,90%{transform:translateY(0);opacity:1}}@keyframes move{0%,15%{transform:translate(0,0)}45%,60%{transform:translate(-105px,-92px)}85%,100%{transform:translate(-28px,-178px)}}@keyframes click{0%,40%,50%,80%,90%,100%{transform:scale(.4);opacity:0}45%,85%{transform:scale(1.8);opacity:.7}}@keyframes float{50%{transform:translateY(-8px)}}@keyframes pulse{50%{transform:scale(1.15)}}@media(prefers-reduced-motion:reduce){*{animation:none!important}}</style>
